<!doctype html>
<html lang="en" class="scrollbar-hidden overflow-y-scroll">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/images/logo_2.png" />
  <link href="/src/style.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="bg-light-1 dark:bg-dark-1 transition-colors duration-300 min-h-screen relative overflow-x-hidden dark:text-dark-3 text-light-3">

  <!-- Sidebar -->
  <div id="sidebar"
    class="fixed top-0 left-0 h-full w-64 bg-light-0 dark:bg-dark-0 text-offwhite transform -translate-x-full transition-transform duration-300 ease-in-out z-50 shadow-lg">
    <div class="p-4 font-semibold text-lg border-b border-gray-700 flex justify-between items-center">
      <span>Confirma</span>
      <button data-toggle="sidebar"
        class="text-offwhite hover:text-gray-400 dark:text-gray-400 dark:hover:text-offwhite transition-colors duration-200">
        ✕
      </button>
    </div>
    <ul class="space-y-2 p-4">
      <li><a href="/verification" class="dark:text-dark-3 text-light-3 block rounded p-3 dark:hover:bg-dark-1 hover:bg-light-1">Verification</a></li>
      <li><a href="/add-holders" class="dark:text-dark-3 text-light-3 block rounded p-3 dark:hover:bg-dark-1 hover:bg-light-1">Add Holders <span class="dark:text-dark-2 text-light-2 text-xs">(admin)</span></a></li>
      <li><a href="/see-holders" class="dark:text-dark-3 text-light-3 block rounded p-3 dark:hover:bg-dark-1 hover:bg-light-1">Current Holders <span class="dark:text-dark-2 text-light-2 text-xs">(admin)</span></a></li>
    </ul>
  </div>

  <div id="overlay" class="fixed inset-0 bg-black hidden transition-opacity duration-300 ease-in-out z-40"
    data-toggle="sidebar">
  </div>

  <!-- Page Content -->
  <div id="page-content">

    <!-- Header -->
    <header
      class="bg-light-0 dark:bg-dark-0 w-full h-16 sticky top-0 z-30 relative flex justify-center items-center shadow">
      <img src="../images/logo.png" class="w-20" />

      <button data-toggle="sidebar" class="absolute left-4">
        <img src="../images/burger.svg" class="w-10 cursor-pointer hidden dark:block">
      </button>
      
      <button data-toggle="sidebar" class="absolute left-4">
        <img src="../images/burger_light.svg" class="w-10 cursor-pointer block dark:hidden">
      </button>
      

      <button id="theme-toggle"
        class="theme-toggle flex items-center justify-center h-12 px-4 py-2 rounded absolute right-4 text-offwhite cursor-pointer">
        <img src="../images/light_off.svg" class="object-contain w-5 h-5 shrink-0 mt-0.5 opacity-0 dark:opacity-100">
        <img src="../images/light_on.svg" class="object-contain w-5 h-5 shrink-0 mt-0.5 opacity-100 dark:opacity-0">
      </button>

    </header>

    <!-- Main content -->
    <main class="flex justify-center mt-10 min-h-[calc(100vh-4rem)] relative z-10">
      <div>
        <!-- CONTENT_PLACEHOLDER -->
      </div>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
