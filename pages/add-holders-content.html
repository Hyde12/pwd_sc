<div class="w-full max-w-2xl bg-color-offwhite shadow-xl rounded-2xl p-6 sm:p-10 border border-color-dark-3">
    <h1 class="text-3xl font-extrabold text-color-dark-0 mb-1">Registration Form</h1>
    <p class="text-color-dark-2 mb-8">Please fill in the details below.</p>

    <form id="form">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-6">
            <div>
                <label for="first_name" class="block text-sm font-medium text-color-dark-1 mb-1">First Name</label>
                <input type="text" id="first_name" name="first_name" placeholder="e.g., Pablo"
                    class="w-full px-4 py-2 border border-color-dark-3 rounded-lg shadow-sm focus:ring-color-light-1 focus:border-color-light-1 transition duration-150"
                    required>
            </div>

            <div>
                <label for="last_name" class="block text-sm font-medium text-color-dark-1 mb-1">Last Name</label>
                <input type="text" id="last_name" name="last_name" placeholder="e.g., Virina"
                    class="w-full px-4 py-2 border border-color-dark-3 rounded-lg shadow-sm focus:ring-color-light-1 focus:border-color-light-1 transition duration-150"
                    required>
            </div>
        </div>

        <div class="mb-6">
            <label for="birth_date" class="block text-sm font-medium text-color-dark-1 mb-1">Birth Date</label>
            <input type="date" id="birth_date" name="birth_date" required
                class="w-full px-4 py-2 border border-color-dark-3 rounded-lg shadow-sm focus:ring-color-light-1 focus:border-color-light-1 transition duration-150">
        </div>

        <div class="mb-6">
            <div class="flex items-center">
                <input id="is_pwd" name="is_pwd" type="checkbox"
                    class="h-4 w-4 text-color-light-1 border-color-dark-3 rounded focus:ring-color-light-1">
                <label for="is_pwd" class="ml-2 block text-sm font-medium text-color-dark-1">
                    Are you a Person With Disability (PWD)?
                </label>
            </div>
        </div>
        <div id="category_field" style="display: none;">
            <label for="category" class="block text-sm font-medium text-color-dark-1 mb-1">Category</label>
            <select id="category" name="category"
                class="w-full mb-13 px-4 py-2 border border-color-dark-3 rounded-lg shadow-sm bg-light-1 dark:bg-dark-1 dark:focus:ring-color-dark-1 dark:focus:border-color-dark-0 transition duration-150">
                <option value="">Select Category</option>
                <option value="" disabled>--- Person With Disability ---</option>
                <option value="Visual Disability">Visual Disability</option>
                <option value="Hearing Disability">Hearing Disability</option>
                <option value="Orthopedic Disability">Orthopedic Disability</option>
                <option value="Intellectual Disability">Intellectual Disability</option>
                <option value="Psychosocial Disability">Psychosocial Disability</option>
                <option value="Learning Disability">Learning Disability</option>
                <option value="Communication Disability">Communication Disability</option>
                <option value="Chronic Illness">Chronic Illness</option>
            </select>
        </div>
        <div
            class="mb-6 p-4 border-2 border-dashed border-color-dark-3 rounded-lg bg-color-light-3 hover:bg-color-light-2 transition duration-150">
            <label for="picture" class="block text-sm font-medium text-color-dark-1 cursor-pointer">
                <div class="flex items-center space-x-3">
                    <svg class="w-6 h-6 text-color-light-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                    </svg>
                    <span class="font-semibold">Holder Picture</span>
                </div>
                <p class="mt-1 text-xs text-color-dark-2">1x1 picture of holder up to 10MB.</p>
            </label>
            <input type="file" id="picture" name="picture" accept="image/*" class="hidden" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-6">
            <div
                class="mb-6 p-4 border-2 border-dashed border-color-dark-3 rounded-lg bg-color-light-3 hover:bg-color-light-2 transition duration-150">
                <label for="picture" class="block text-sm font-medium text-color-dark-1 cursor-pointer">
                    <div class="flex items-center space-x-3">
                        <svg class="w-6 h-6 text-color-light-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                        </svg>
                        <span class="font-semibold">Birth Certificate</span>
                    </div>
                </label>
                <input type="file" id="picture" name="picture" accept="image/*" class="hidden" />
            </div>
            <div
                class="mb-6 p-4 border-2 border-dashed border-color-dark-3 rounded-lg bg-color-light-3 hover:bg-color-light-2 transition duration-150">
                <label for="picture" class="block text-sm font-medium text-color-dark-1 cursor-pointer">
                    <div class="flex items-center space-x-3">
                        <svg class="w-6 h-6 text-color-light-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                        </svg>
                        <span class="font-semibold">Placeholder</span>
                    </div>
                </label>
                <input type="file" id="picture" name="picture" accept="image/*" class="hidden" />
            </div>
        </div>

        <div class="flex justify-end mt-10">
            <button type="submit"
                class="px-6 py-2 bg-light-0 dark:bg-dark-0 text-color-offwhite font-semibold rounded-lg hover:bg-light-2 dark:hover:bg-dark-2 focus:outline-none focus:ring-4 focus:ring-color-light-1 focus:ring-opacity-50 transition duration-200">
                Submit Form
            </button>
        </div>
    </form>
</div>
<script type="module" src="../src/add-holder.js"></script>
